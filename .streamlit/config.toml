[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#1E293B"
font = "sans serif"

# Tema escuro nativo: fundo escuro + texto claro (incluindo dataframes)
[theme.dark]
primaryColor = "#60a5fa"
backgroundColor = "#0e0e1a"
secondaryBackgroundColor = "#1e1e2e"
textColor = "#e8e8e8"

[server]
maxUploadSize = 5
